# render.yaml — Render Infrastructure as Code Blueprint
# DraftMate Evidence Intelligence: Production Backend API Service with Managed PostgreSQL

databases:
  - name: draftmate-postgres
    plan: free # Free tier or Starter for permanent retention
    databaseName: draftmate
    user: draftmate_user
    region: singapore # Low-latency region for Indian judicial tech workflows

services:
  - type: web
    name: draftmate-ai
    env: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: draftmate-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a secure 256-bit secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GEMINI_API_KEY
        sync: false # Set your Google Gemini API Key in the Render dashboard
      - key: CORS_ORIGIN
        value: "netlify.app" # Allows Netlify frontend to connect with credentials
